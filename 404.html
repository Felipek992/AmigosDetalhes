<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Amigos Detalhes</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0A0A0A;color:#F5F0E8;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;
    background-image:linear-gradient(rgba(201,168,76,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.03) 1px,transparent 1px);background-size:52px 52px;}
    .box{max-width:480px;}
    .num{font-family:'Bebas Neue',sans-serif;font-size:clamp(6rem,25vw,10rem);color:#C9A84C;line-height:1;letter-spacing:4px;opacity:.18;}
    .ic{font-size:3.5rem;margin:-20px 0 16px;}
    h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.8rem,6vw,2.8rem);letter-spacing:3px;color:#C9A84C;margin-bottom:12px;}
    p{font-size:.88rem;color:rgba(245,240,232,.5);line-height:1.65;margin-bottom:32px;}
    .btn{display:inline-block;background:#C9A84C;color:#0A0A0A;padding:14px 32px;text-decoration:none;font-size:.78rem;font-weight:500;letter-spacing:2px;text-transform:uppercase;border-radius:2px;transition:background .2s;}
    .btn:hover{background:#E8C96A;}
    .btn-out{display:inline-block;border:1px solid rgba(201,168,76,.28);color:#C9A84C;padding:14px 32px;text-decoration:none;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;border-radius:2px;margin-left:10px;transition:all .2s;}
    .btn-out:hover{border-color:#C9A84C;}
  </style>
</head>
<body>
  <div class="box">
    <div class="num">404</div>
    <div class="ic">🚗</div>
    <h1>PÁGINA NÃO ENCONTRADA</h1>
    <p>Parece que você foi parar num beco sem saída. A página que procura não existe ou foi movida.</p>
    <a href="index.html" class="btn">Voltar ao Início</a>
    <a href="index.html#agendamento" class="btn-out">Agendar Serviço</a>
  </div>
</body>
</html>
